simple_voting.settings:
  path: '/admin/config/services/simple-voting'
  defaults:
    _form: '\Drupal\simple_voting\Form\SimpleVotingSettingsForm'
    _title: 'Simple Voting settings'
  requirements:
    _permission: 'administer simple voting'

simple_voting.api.questions:
  path: '/api/questions'
  defaults:
    _controller: 'simple_voting.question_api_controller:list'
  requirements:
    _access: 'TRUE'
  methods: [GET]

simple_voting.api.question:
  path: '/api/questions/{identifier}'
  defaults:
    _controller: 'simple_voting.question_api_controller:show'
  requirements:
    _access: 'TRUE'
  methods: [GET]

simple_voting.api.vote:
  path: '/api/questions/{identifier}/vote'
  defaults:
    _controller: 'simple_voting.question_api_controller:vote'
  requirements:
    _user_is_logged_in: 'TRUE'
    _csrf_token: 'TRUE'
  methods: [POST]

simple_voting.api.results:
  path: '/api/questions/{identifier}/results'
  defaults:
    _controller: 'simple_voting.question_api_controller:results'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [GET]

simple_voting.cms_vote:
  path: '/admin/content/simple-voting/questions/{identifier}/vote'
  defaults:
    _form: '\Drupal\simple_voting\Form\VoteForm'
    _title: 'Vote'
  requirements:
    _permission: 'administer simple voting'

simple_voting.cms_results:
  path: '/admin/content/simple-voting/questions/{identifier}/results'
  defaults:
    _controller: '\Drupal\simple_voting\Controller\VotingController::results'
    _title: 'Voting results'
  requirements:
    _permission: 'administer simple voting'

simple_voting.cms_question_options:
  path: '/admin/content/simple-voting/questions/{identifier}/options'
  defaults:
    _form: '\Drupal\simple_voting\Form\QuestionOptionsForm'
    _title: 'Question options'
  requirements:
    _permission: 'administer simple voting'
